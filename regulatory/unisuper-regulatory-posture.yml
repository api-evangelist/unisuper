  PDF (dated December 2025, ref US25-0394 1225) linked from the privacy statement downloaded directly
  (HTTP 200, application/pdf, 146963 bytes). The terms page was not re-read, and no signal is drawn from it.
  The policy is written under the Australian Privacy Act 1988 and the 13 Australian Privacy Principles.
  It does not cover AI, subprocessor lists, Global Privacy Control or age assurance, so nothing is
  recorded for those signals.
